[project]
name = "kakafandodo-coplayer-backend"
version = "1.0.0"
description = "Backend FastAPI autoritaire pour KAKAFANDODO Twist 2 Co-player"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "maps*"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0", "pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
